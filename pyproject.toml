[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autotrader"
version = "0.1.0"
description = "Bot de trading automatico (paper trading) con backtesting y ejecucion via Alpaca."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
autotrader = "autotrader.cli:main"

[tool.setuptools.packages.find]
include = ["autotrader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
