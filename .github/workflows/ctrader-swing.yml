name: ctrader-swing

# Bot swing (bandas de Bollinger 4 h, solo largos, 1-3 dias) sobre una SEGUNDA cuenta demo de cTrader
# que simula 200 USD con apalancamiento 1:500. Corre tras el cierre de cada barra de 4 h.
# Secrets: CTRADER_CLIENT_ID, CTRADER_CLIENT_SECRET, CTRADER_ACCESS_TOKEN (token que incluya esta cuenta),
#          CTRADER_SWING_ACCOUNT_LOGIN (numero de la cuenta demo de 200 USD).
on:
  schedule:
    - cron: "7 0,4,8,12,16,20 * * 0-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo decidir, sin enviar ordenes"
        type: boolean
        default: false

permissions:
  contents: write

env:
  SCHEDULE_ENABLED: "false"

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$SCHEDULE_ENABLED" = "true" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi

  swing:
    needs: gate
    if: ${{ needs.gate.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BROKER: ctrader
      DATA_PROVIDER: ctrader
      CTRADER_DEMO: "true"
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCOUNT_LOGIN: ${{ secrets.CTRADER_SWING_ACCOUNT_LOGIN }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      # Indices y forex son operables con 200 USD; oro y petroleo se saltan solos si el lote minimo arriesga > 3 %
      SYMBOLS: "US500,NAS100,EURUSD,GBPUSD,XAUUSD,XTIUSD"
      RISK_PER_TRADE: "0.01"
      EQUITY_CAP: "200"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Ciclo swing
        run: python -m autotrader.cli --env /dev/null swing-run ${{ inputs.dry_run && '--dry-run' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swing-log-${{ github.run_id }}
          path: state/run_log.jsonl
          if-no-files-found: ignore
