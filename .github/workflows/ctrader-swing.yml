name: ctrader-swing

# Bot swing (bandas de Bollinger 4 h, solo largos, 1-3 dias) sobre una SEGUNDA cuenta demo de cTrader
# fondeada con 200 USD y apalancamiento 1:500. Corre cada hora: GitHub retrasa u omite los cron con frecuencia,
# asi que se lanza a menudo y el bot solo entra si la ultima barra de 4 h cerro hace menos de 2 h.
# Secrets: CTRADER_CLIENT_ID, CTRADER_CLIENT_SECRET, CTRADER_ACCESS_TOKEN (token que incluya esta cuenta),
#          CTRADER_SWING_ACCOUNT_LOGIN (numero de la cuenta demo de 200 USD).
on:
  schedule:
    - cron: "7 * * * 0-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo decidir, sin enviar ordenes"
        type: boolean
        default: false

permissions:
  contents: write

env:
  SCHEDULE_ENABLED: "true"

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$SCHEDULE_ENABLED" = "true" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi

  swing:
    needs: gate
    if: ${{ needs.gate.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BROKER: ctrader
      DATA_PROVIDER: ctrader
      CTRADER_DEMO: "true"
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCOUNT_LOGIN: ${{ secrets.CTRADER_SWING_ACCOUNT_LOGIN }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      # Freno global: BOT_HALT (variable del repositorio: off | freeze | close) y freno por drawdown desde el maximo
      BOT_HALT: ${{ vars.BOT_HALT || 'off' }}
      MAX_DRAWDOWN_PCT: ${{ vars.MAX_DRAWDOWN_PCT || '0.10' }}
      # Indices y forex son operables con 200 USD; oro y petroleo se saltan solos si el lote minimo arriesga
      # mas de SWING_MAX_RISK_PCT
      SYMBOLS: "US500,NAS100,EURUSD,GBPUSD,XAUUSD,XTIUSD"
      # Riesgo agresivo a peticion del usuario: 5 % del equity por operacion (tope 7.5 % para aceptar lotes minimos)
      RISK_PER_TRADE: "0.05"
      SWING_MAX_RISK_PCT: "0.075"
      # Solo entra si la barra H4 de la senal cerro hace menos de 2 h
      SWING_MAX_SIGNAL_AGE_HOURS: "2"
      # Sin tope: el tamano se calcula sobre el equity real de la cuenta (200 USD al inicio) y compone con ella
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Ciclo swing
        run: python -m autotrader.cli --env /dev/null swing-run ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Estado de la cuenta y panel
        if: ${{ !inputs.dry_run }}
        run: |
          python scripts/ctrader_state.py --swing --initial 200 --out docs/swing_state.json
          python scripts/dashboard.py --no-live --out reports/dashboard.html
          cp reports/dashboard.html docs/index.html
          cp reports/dashboard.html docs/dashboard.html
      - name: Publicar panel
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/swing_state.json docs/index.html docs/dashboard.html
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -m "Panel: actualización automática (swing)"
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push && break || sleep 5; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swing-log-${{ github.run_id }}
          path: state/run_log.jsonl
          if-no-files-found: ignore
