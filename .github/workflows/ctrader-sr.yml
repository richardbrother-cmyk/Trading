name: ctrader-sr

# Bot de SOPORTES Y RESISTENCIAS (rebote en un soporte H4 con al menos 2 toques, solo largos, objetivo en la siguiente resistencia con
# un minimo de 2 R, stop bajo el nivel, hasta 7 dias). Mismo motor que el bot swing (estrategia "sr", ver autotrader/sr.py y
# scripts/sr_backtest.py). Corre cada hora y solo entra si la ultima barra de 4 h cerro hace menos de 2 h. Etiqueta propia: autotrader-sr.
# Desde el 3-10-2026 opera en la cuenta demo de EVIDENCIA (10142501, 1.000 USD, 1:500), compartida solo con el bot de Elliott: las dos
# operativas con mejor evidencia, separadas de las apuestas de la cuenta agresiva y de las operaciones manuales. Este workflow es el que
# publica el estado de esa cuenta (docs/edge_state.json). Secrets: CTRADER_CLIENT_ID, CTRADER_CLIENT_SECRET, CTRADER_ACCESS_TOKEN y,
# opcionalmente, CTRADER_EDGE_ACCOUNT_LOGIN (si no existe se usa el numero de cuenta escrito aqui).
on:
  schedule:
    - cron: "14 * * * 0-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo decidir, sin enviar ordenes"
        type: boolean
        default: false

# Un solo run a la vez por workflow: si un ciclo se retrasa y se solapa con el siguiente, el nuevo espera en cola
# (no se cancela el que puede estar enviando ordenes). Evita ordenes duplicadas por ejecuciones solapadas.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  SCHEDULE_ENABLED: "true"

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$SCHEDULE_ENABLED" = "true" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi

  sr:
    needs: gate
    if: ${{ needs.gate.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BROKER: ctrader
      DATA_PROVIDER: ctrader
      CTRADER_DEMO: "true"
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCOUNT_LOGIN: ${{ secrets.CTRADER_EDGE_ACCOUNT_LOGIN || '10142501' }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      # Freno de la cuenta de evidencia (compartido con el bot de Elliott): interruptor manual y drawdown desde el maximo
      BOT_HALT: ${{ vars.EDGE_BOT_HALT || vars.BOT_HALT || 'off' }}
      # Freno al 20 % desde el maximo: cuenta limpia, sin operaciones manuales, con dos bots de 2-3 % de riesgo. La simulacion de S/R
      # al 3 % da una caida maxima historica del 18 % y un 1 % de probabilidad de llegar al 50 %, asi que un 20 % ya senala algo raro.
      MAX_DRAWDOWN_PCT: "0.20"
      # Oro y petroleo se saltan solos si el lote minimo arriesga mas de SWING_MAX_RISK_PCT (con 1.000 USD caben casi siempre)
      SYMBOLS: "US500,NAS100,EURUSD,GBPUSD,XAUUSD,XTIUSD"
      # Freno por drawdown con el historial REAL de la cuenta de evidencia
      EQUITY_HISTORY: "docs/edge_state.json"
      # Perfil: rebote en soporte H4 (solo largos). Parametros fijados con scripts/sr_backtest.py (3 anos, 6 simbolos, periodo de ajuste
      # y periodo ciego): 2 toques, memoria de 300 barras, objetivo en la siguiente resistencia con minimo 2 R, sobre la EMA200.
      SWING_STRATEGY: "sr"
      SWING_SR_MODE: "bounce"
      SWING_SR_LOOKBACK: "300"
      SWING_SR_MIN_TOUCHES: "2"
      SWING_SR_TARGET: "level"
      SWING_SR_MIN_RR: "2.0"
      SWING_SR_TREND: "true"
      SWING_MAX_HOLD_DAYS: "7"
      SWING_LABEL: "autotrader-sr"
      SWING_MAX_POSITIONS: "2"
      # Riesgo por operacion 3 %: la mitad que el bot de rupturas, porque la ventaja de esta estrategia es mas fina y menos probada.
      # Con 3 % el lote minimo se acepta hasta 4,5 % (oro y petroleo se saltan solos si no caben en 500 USD).
      RISK_PER_TRADE: "0.03"
      SWING_MAX_RISK_PCT: ${{ vars.SR_MAX_RISK_PCT || '0' }}
      SWING_MAX_SIGNAL_AGE_HOURS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Ciclo de soportes y resistencias
        run: python -m autotrader.cli --env /dev/null swing-run ${{ inputs.dry_run && '--dry-run' || '' }}
      # Este workflow publica el estado de la cuenta de evidencia (posiciones, operaciones, equity, historial para el freno) con las
      # etiquetas de los dos bots que la operan, ademas del ultimo ciclo propio.
      - name: Estado de la cuenta, del bot y panel
        if: ${{ !inputs.dry_run }}
        run: |
          python scripts/ctrader_state.py --swing --initial 1000 --label autotrader-sr,autotrader-elliott --out docs/edge_state.json
          python scripts/sr_state.py --label autotrader-sr --out docs/sr_state.json
          python scripts/dashboard.py --no-live --out reports/dashboard.html
          cp reports/dashboard.html docs/index.html
          cp reports/dashboard.html docs/dashboard.html
      - name: Publicar panel
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/edge_state.json docs/sr_state.json docs/index.html docs/dashboard.html
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -m "Panel: actualización automática (soportes y resistencias)"
          # Los ficheros del panel los regeneran varios workflows: ante conflicto gana la version recien generada.
          ok=0
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs -q origin "${GITHUB_REF_NAME}" && git push; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          [ "$ok" = "1" ] || { echo "::error::no se pudo publicar el panel tras 4 intentos"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sr-log-${{ github.run_id }}
          path: state/run_log.jsonl
          if-no-files-found: ignore
