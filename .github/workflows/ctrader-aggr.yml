name: ctrader-aggr

# Bot AGRESIVO (ruptura de 4 h, solo largos, stop 0,75 ATR, objetivo 6R fijo en el broker, hasta 7 dias) sobre una
# TERCERA cuenta demo de cTrader fondeada con 500 USD y apalancamiento 1:500. Mismo motor que el bot swing con otro
# perfil. Corre cada hora y solo entra si la ultima barra de 4 h cerro hace menos de 2 h.
# Secrets: CTRADER_CLIENT_ID, CTRADER_CLIENT_SECRET, CTRADER_ACCESS_TOKEN (token que incluya esta cuenta),
#          CTRADER_AGGR_ACCOUNT_LOGIN (numero de la cuenta demo de 500 USD).
on:
  schedule:
    - cron: "9 * * * 0-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo decidir, sin enviar ordenes"
        type: boolean
        default: false

# Un solo run a la vez por workflow: si un ciclo se retrasa y se solapa con el siguiente, el nuevo espera en cola
# (no se cancela el que puede estar enviando ordenes). Evita ordenes duplicadas por ejecuciones solapadas.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  SCHEDULE_ENABLED: "true"

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$SCHEDULE_ENABLED" = "true" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi

  aggr:
    needs: gate
    if: ${{ needs.gate.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BROKER: ctrader
      DATA_PROVIDER: ctrader
      CTRADER_DEMO: "true"
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCOUNT_LOGIN: ${{ secrets.CTRADER_AGGR_ACCOUNT_LOGIN }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      # Freno global: BOT_HALT (variable del repositorio: off | freeze | close) y freno por drawdown desde el maximo
      BOT_HALT: ${{ vars.AGGR_BOT_HALT || vars.BOT_HALT || 'off' }}
      # Freno al 50 % desde el maximo (decidido con la simulacion a 3 anos: con 30 % saltaba a los dos meses en todos
      # los recorridos). Valor fijo en el workflow: las variables del repositorio ya no lo cambian.
      MAX_DRAWDOWN_PCT: "0.50"
      # Indices y forex son operables con 200 USD; oro y petroleo se saltan solos si el lote minimo arriesga
      # mas de SWING_MAX_RISK_PCT
      SYMBOLS: "US500,NAS100,EURUSD,GBPUSD,XAUUSD,XTIUSD"
      # Perfil: ruptura H4 con stop corto y objetivo 6R fijo, maximo de 3 posiciones abiertas.
      SWING_STRATEGY: "breakout"
      SWING_BREAKOUT_BARS: "20"
      SWING_STOP_ATR: "0.75"
      SWING_TP_ATR: "4.5"
      SWING_PURE_RR: "true"
      SWING_MAX_HOLD_DAYS: "7"
      # Stop a break even: cuando la posicion lleva ganados 2 R (dos veces la distancia al stop inicial) el stop sube a la entrada
      # mas 0,1 R para cubrir spread y comision; se revisa cada hora con el ultimo precio de 1 minuto.
      SWING_BREAKEVEN_R: ${{ vars.AGGR_BREAKEVEN_R || '2.0' }}
      SWING_BREAKEVEN_LOCK_R: ${{ vars.AGGR_BREAKEVEN_LOCK_R || '0.1' }}
      SWING_LABEL: "autotrader-aggr"
      SWING_MAX_POSITIONS: "3"
      # Riesgo por operacion 3 % (decidido con la simulacion a 3 anos: con 6 % la cuenta no sobrevivia al ano plano).
      # Valor fijo en el workflow: la variable AGGR_RISK_PER_TRADE del repositorio ya no se lee.
      RISK_PER_TRADE: "0.03"
      # Tope para aceptar el lote minimo: si no se fija, 1,5x el riesgo por operacion
      SWING_MAX_RISK_PCT: ${{ vars.AGGR_MAX_RISK_PCT || '0' }}
      SWING_MAX_SIGNAL_AGE_HOURS: "2"
      # Regla de retiros: al ganar el 80 % sobre la base (saldo tras el ultimo retiro, o los 500 iniciales) toca retirar
      # el 30 % del saldo. El bot no retira: avisa con un issue en GitHub y, cuando detecta el retiro en el historial de
      # caja, reinicia la base y el maximo del freno.
      WITHDRAW_TRIGGER_PCT: "0.80"
      WITHDRAW_PCT: "0.30"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Ciclo swing
        run: python -m autotrader.cli --env /dev/null swing-run ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Estado de la cuenta y panel
        if: ${{ !inputs.dry_run }}
        run: |
          python scripts/ctrader_state.py --swing --initial 500 --label autotrader-aggr --out docs/aggr_state.json
          python scripts/dashboard.py --no-live --out reports/dashboard.html
          cp reports/dashboard.html docs/index.html
          cp reports/dashboard.html docs/dashboard.html
      - name: Aviso de retiro (issue en GitHub)
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/retiro.txt
          import json
          s = json.load(open("docs/aggr_state.json"))
          w = s.get("withdrawal") or {}
          print("alert" if w.get("alert") else "ok")
          print(json.dumps(w))
          print(s.get("equity"))
          PY
          state=$(sed -n 1p /tmp/retiro.txt); info=$(sed -n 2p /tmp/retiro.txt); equity=$(sed -n 3p /tmp/retiro.txt)
          gh label create retiro --description "Toca retirar beneficios de la cuenta agresiva" --color 1D76DB 2>/dev/null || true
          open=$(gh issue list --label retiro --state open --json number --jq '.[0].number')
          if [ "$state" = "alert" ] && [ -z "$open" ]; then
            base=$(echo "$info" | python -c 'import sys,json; w=json.load(sys.stdin); print(w["base"])')
            amount=$(echo "$info" | python -c 'import sys,json; w=json.load(sys.stdin); print(w["suggested_amount"])')
            after=$(echo "$info" | python -c 'import sys,json; w=json.load(sys.stdin); print(w["equity_after"])')
            gh issue create --label retiro --title "Cuenta agresiva: toca retirar el 30 % (saldo ${equity} USD)" \
              --body "La cuenta agresiva ha ganado un 80 % sobre su base de ${base} USD: el capital es ${equity} USD.

          Según la regla acordada toca **retirar ${amount} USD** (30 % del saldo), dejando unos ${after} USD en la cuenta.

          Cuando el retiro aparezca en el historial de caja de cTrader, el bot reinicia la base y el máximo del freno automáticamente y cierra este aviso.

          Panel: https://richardbrother-cmyk.github.io/Trading/"
            echo "aviso creado"
          elif [ "$state" != "alert" ] && [ -n "$open" ]; then
            gh issue close "$open" --comment "Retiro detectado o aviso ya no vigente: base actualizada. Capital actual ${equity} USD."
            echo "aviso cerrado (#$open)"
          else
            echo "sin cambios ($state)"
          fi
      - name: Publicar panel
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/aggr_state.json docs/index.html docs/dashboard.html
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -m "Panel: actualización automática (agresiva)"
          # Los ficheros del panel los regeneran varios workflows: ante conflicto gana la version recien generada.
          ok=0
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs -q origin "${GITHUB_REF_NAME}" && git push; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          [ "$ok" = "1" ] || { echo "::error::no se pudo publicar el panel tras 4 intentos"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aggr-log-${{ github.run_id }}
          path: state/run_log.jsonl
          if-no-files-found: ignore
