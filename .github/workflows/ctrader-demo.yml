name: ctrader-demo

# Ciclo del bot contra la cuenta DEMO de cTrader (Fusion Markets), cada hora de domingo noche a viernes.
# Secrets necesarios: CTRADER_CLIENT_ID, CTRADER_CLIENT_SECRET, CTRADER_ACCOUNT_LOGIN, CTRADER_ACCESS_TOKEN.
# El access token dura 30 días. cTrader rota el refresh token en cada renovación e invalida el anterior,
# así que el workflow NO renueva: cada ~30 días se renueva fuera (scripts/ctrader_token.py --refresh)
# y se actualiza el secret CTRADER_ACCESS_TOKEN.
# Los servidores de cTrader usan el puerto 5035, alcanzable desde los runners de GitHub.
on:
  schedule:
    - cron: "5 * * * 0-5"
  workflow_dispatch:
    inputs:
      check_only:
        description: "Solo verificar conexion y simbolos (sin operar)"
        type: boolean
        default: false

env:
  # Interruptor de los ciclos programados. Los lanzamientos manuales (workflow_dispatch) siempre corren.
  SCHEDULE_ENABLED: "true"

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$SCHEDULE_ENABLED" = "true" ] || [ "${{ vars.CTRADER_ENABLED }}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  cycle:
    needs: gate
    if: ${{ needs.gate.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BROKER: ctrader
      DATA_PROVIDER: ctrader
      CTRADER_DEMO: "true"
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCOUNT_LOGIN: ${{ secrets.CTRADER_ACCOUNT_LOGIN }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      # Parametros para CFDs: stop mas corto que en acciones y exposicion nominal hasta 5x el equity
      # (el riesgo por operacion sigue siendo el 2 % del equity; el apalancamiento solo amplia el tamano).
      # Metales, energia, agricolas (cafe, algodon, trigo, maiz, azucar) e indices, todo como CFD en Fusion Markets
      SYMBOLS: ${{ vars.CTRADER_SYMBOLS || 'XAUUSD,XAGUSD,XPTUSD,XTIUSD,XBRUSD,XNGUSD,COFARA,COTTON,WHEAT,CORN,SUGAR,US500,NAS100' }}
      EXPOSURE_LEVERAGE: ${{ vars.EXPOSURE_LEVERAGE || '5' }}
      STOP_LOSS_PCT: ${{ vars.CTRADER_STOP_LOSS_PCT || '0.03' }}
      MAX_POSITIONS: "8"
      MAX_POSITION_PCT: "0.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Verificar conexion y simbolos
        run: python -m autotrader.cli --env /dev/null ctrader-check
      - name: Ciclo de trading (demo)
        if: ${{ !inputs.check_only }}
        run: python -m autotrader.cli --env /dev/null run
      - name: Estado de la cuenta y panel
        if: ${{ !inputs.check_only }}
        run: |
          python scripts/ctrader_state.py --out docs/ctrader_state.json
          python scripts/dashboard.py --no-live --out reports/dashboard.html
          cp reports/dashboard.html docs/index.html
          cp reports/dashboard.html docs/dashboard.html
      - name: Publicar panel
        if: ${{ !inputs.check_only }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ctrader_state.json docs/index.html docs/dashboard.html
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -m "Panel: actualización automática (cTrader)"
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push && break || sleep 5; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctrader-log-${{ github.run_id }}
          path: state/run_log.jsonl
          if-no-files-found: ignore
