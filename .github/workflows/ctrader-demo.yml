name: ctrader-demo

# Ciclo del bot contra la cuenta DEMO de cTrader (Fusion Markets), cada hora de domingo noche a viernes.
# Secrets necesarios: CTRADER_CLIENT_ID, CTRADER_CLIENT_SECRET, CTRADER_ACCOUNT_LOGIN, CTRADER_ACCESS_TOKEN.
# El access token dura 30 días. cTrader rota el refresh token en cada renovación e invalida el anterior,
# así que el workflow NO renueva: cada ~30 días se renueva fuera (scripts/ctrader_token.py --refresh)
# y se actualiza el secret CTRADER_ACCESS_TOKEN.
# Los servidores de cTrader usan el puerto 5035, alcanzable desde los runners de GitHub.
on:
  schedule:
    - cron: "5 * * * 0-5"
  workflow_dispatch:
    inputs:
      check_only:
        description: "Solo verificar conexion y simbolos (sin operar)"
        type: boolean
        default: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ vars.CTRADER_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    env:
      BROKER: ctrader
      DATA_PROVIDER: ctrader
      CTRADER_DEMO: "true"
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCOUNT_LOGIN: ${{ secrets.CTRADER_ACCOUNT_LOGIN }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      # Parametros para CFDs: stop mas corto que en acciones y exposicion nominal hasta 5x el equity
      # (el riesgo por operacion sigue siendo el 2 % del equity; el apalancamiento solo amplia el tamano).
      SYMBOLS: ${{ vars.CTRADER_SYMBOLS || 'XAUUSD,XAGUSD,XPTUSD,XPDUSD,XTIUSD,XBRUSD,US500,NAS100' }}
      EXPOSURE_LEVERAGE: ${{ vars.EXPOSURE_LEVERAGE || '5' }}
      STOP_LOSS_PCT: ${{ vars.CTRADER_STOP_LOSS_PCT || '0.03' }}
      MAX_POSITIONS: "8"
      MAX_POSITION_PCT: "0.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Verificar conexion y simbolos
        run: python -m autotrader.cli --env /dev/null ctrader-check
      - name: Ciclo de trading (demo)
        if: ${{ !inputs.check_only }}
        run: python -m autotrader.cli --env /dev/null run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctrader-log-${{ github.run_id }}
          path: state/run_log.jsonl
          if-no-files-found: ignore
