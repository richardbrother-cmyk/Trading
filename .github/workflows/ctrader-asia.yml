name: ctrader-asia

# Bot intradia "retest de Asia" sobre el oro (XAUUSD) en la MISMA cuenta demo agresiva de cTrader (500 USD):
# rango de Asia (19:00-03:00 NY), primera vela de 15 min de la manana de NY que cierra fuera, retest del nivel sin
# cerrar dentro, entrada a favor con stop en la mitad del rango y objetivo 2R, cierre a las 12:00 NY. Una operacion al dia.
# El cron de GitHub es poco fiable (hoy dispara cada varias horas), asi que en vez de un run cada 15 minutos hay UN run
# diario que arranca antes de las 08:00 de Nueva York y repite el ciclo cada cuarto de hora dentro del propio job hasta
# las 12:06 NY. Si el cron llega tarde, el bucle empieza donde este; si no llega, el vigilante de la sesion de Claude
# lo lanza a mano (workflow_dispatch). Secrets: los mismos que ctrader-aggr.
on:
  schedule:
    - cron: "50 11 * * 1-5"
    - cron: "50 12 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo decidir, sin enviar ordenes"
        type: boolean
        default: false

# Un solo run a la vez: si un ciclo se retrasa y se solapa con el siguiente, el nuevo espera en cola.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  SCHEDULE_ENABLED: "true"

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$SCHEDULE_ENABLED" = "true" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi

  asia:
    needs: gate
    if: ${{ needs.gate.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      BROKER: ctrader
      DATA_PROVIDER: ctrader
      CTRADER_DEMO: "true"
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCOUNT_LOGIN: ${{ secrets.CTRADER_AGGR_ACCOUNT_LOGIN }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      # Freno compartido con el bot agresivo (misma cuenta): interruptor manual y drawdown desde el maximo
      BOT_HALT: ${{ vars.AGGR_BOT_HALT || vars.BOT_HALT || 'off' }}
      MAX_DRAWDOWN_PCT: "0.50"
      SYMBOLS: "XAUUSD"
      # 6 % de riesgo por operacion (cuenta demo: se prueba la regla de forma agresiva); lote minimo aceptado hasta 9 %
      RISK_PER_TRADE: "0.06"
      ASIA_RR: "2.0"
      ASIA_MAX_WAIT_BARS: "8"
      ASIA_LABEL: "autotrader-asia"
      ASIA_STATE_PATH: "docs/asia_state.json"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q tests/test_asiabot.py tests/test_guard.py
      - name: Ciclos de la manana de NY (bucle cada 15 min hasta las 12:06 NY)
        env:
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          publish_state() {
            python scripts/dashboard.py --no-live --out reports/dashboard.html
            cp reports/dashboard.html docs/index.html
            cp reports/dashboard.html docs/dashboard.html
            git add docs/asia_state.json docs/index.html docs/dashboard.html
            if git diff --cached --quiet; then echo "sin cambios que publicar"; return 0; fi
            git commit -q -m "Panel: actualización automática (asia)"
            for i in 1 2 3 4; do
              if git pull --rebase -X theirs -q origin "${GITHUB_REF_NAME}" && git push -q; then echo "estado publicado"; return 0; fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 5))
            done
            echo "::warning::no se pudo publicar el estado tras 4 intentos"
          }
          while true; do
            python -m autotrader.cli --env /dev/null asia-run $DRY_RUN | tee /tmp/asia.json
            read -r publish nyhm < <(python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          txt = open("/tmp/asia.json").read()
          d = json.loads(txt[txt.index("{"):])
          print("true" if d.get("publish") else "false", datetime.now(ZoneInfo("America/New_York")).strftime("%H%M"))
          PY
          )
            if [ -z "$DRY_RUN" ] && [ "$publish" = "true" ]; then publish_state; fi
            if [ -n "$DRY_RUN" ]; then echo "dry run: un solo ciclo"; break; fi
            if [ "$nyhm" -ge 1206 ]; then echo "fin de la ventana (12:06 NY)"; break; fi
            # dormir hasta el siguiente cuarto de hora (+40 s para que la vela este cerrada en el servidor)
            sleep $(python -c "import time; t=time.time(); print(int(900 - (t % 900)) + 40)")
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asia-log-${{ github.run_id }}
          path: state/run_log.jsonl
          if-no-files-found: ignore
